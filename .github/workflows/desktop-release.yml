name: Desktop release draft
# Builds the portable EXE and setup from a clean runner, verifies the portable
# first launch, records build provenance, and attaches everything to a DRAFT
# prerelease. A maintainer reviews the draft and publishes it by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, for example 0.1.3'
        required: true
      tag:
        description: 'New release tag, for example v0.1.3-rc.1'
        required: true
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  draft:
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Validate inputs
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'version must look like 0.1.3.' }
          if ($env:RELEASE_TAG -notmatch "^v$([regex]::Escape($env:RELEASE_VERSION))(-[0-9A-Za-z.]+)?$") { throw 'tag must be v<version> with an optional suffix such as -rc.1.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install pinned Rust
        run: |
          $pin = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel\s*=\s*"([^"]+)"').Groups[1].Value
          rustup toolchain install $pin --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
      - name: Verify native core
        run: ./scripts/verify-core.ps1
      - name: Build portable EXE and setup
        run: ./scripts/package-desktop.ps1 -Version $env:RELEASE_VERSION
      - name: Verify per-user setup install and uninstall
        run: ./scripts/verify-desktop-installer.ps1 -Version $env:RELEASE_VERSION
      - name: Verify portable first launch
        run: ./scripts/verify-portable.ps1 -Version $env:RELEASE_VERSION -AllowElevated
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            artifacts/desktop/${{ inputs.version }}/Cleanup.exe
            artifacts/desktop/${{ inputs.version }}/*-setup.exe
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = "artifacts/desktop/$env:RELEASE_VERSION"
          $notes = @"
          **Download ``Cleanup.exe`` and double-click it.** It runs as a normal user and includes its runtime. On first launch, Windows support files are extracted to the temporary folder.

          Keep ``CleanupData`` beside ``Cleanup.exe`` to carry portable settings and history between PCs. If that folder is read-only, Cleanup uses the current user's profile instead. Prefer a Start menu shortcut? Use the per-user setup EXE.

          Windows 11 x64. This unsigned preview may show an unknown-publisher warning. Some applications' official uninstallers may ask Windows for approval.
          "@
          gh release create $env:RELEASE_TAG --draft --prerelease --target $env:GITHUB_SHA `
            --title "cleanup $env:RELEASE_VERSION" --notes ($notes -replace '(?m)^ {10}', '') `
            "$out/Cleanup.exe" (Get-Item "$out/*-setup.exe").FullName "$out/Cleanup-Notices.zip" "$out/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
