name: Desktop installer
on:
  push:
    paths: ['src/**', 'scripts/**', 'packaging/**', 'release.json', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['src/**', 'scripts/**', 'packaging/**', 'release.json', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  setup:
    runs-on: windows-2025
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install pinned Rust
        run: |
          $pin = [regex]::Match((Get-Content rust-toolchain.toml -Raw), 'channel\s*=\s*"([^"]+)"').Groups[1].Value
          rustup toolchain install $pin --profile minimal --component clippy,rustfmt --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
      - name: Build portable EXE and self-contained setup
        run: ./scripts/package-desktop.ps1 -Version 0.1.5
      - name: Verify per-user setup install and uninstall
        run: ./scripts/verify-desktop-installer.ps1 -Version 0.1.5
      - name: Verify portable first launch
        run: ./scripts/verify-portable.ps1 -Version 0.1.5 -AllowElevated
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cleanup-desktop-x64
          if-no-files-found: error
          path: |
            artifacts/desktop/0.1.5/Cleanup.exe
            artifacts/desktop/0.1.5/*-setup.exe
            artifacts/desktop/0.1.5/Cleanup-Notices.zip
            artifacts/desktop/0.1.5/SHA256SUMS.txt
